name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          out="mtufinder-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w" -o "$out" ./...
          ls -la "$out"

      - name: build .deb
        if: matrix.goos == 'linux'
        env:
          ARCH: ${{ matrix.goarch }}
        run: |
          # nfpm only expands env vars in version-ish fields, so we sed the
          # arch/version placeholders into a generated config ourselves.
          export VERSION="${GITHUB_REF_NAME#v}"
          sed -e "s|\${ARCH}|$ARCH|g" -e "s|\${VERSION}|$VERSION|g" \
            nfpm.yaml > nfpm.gen.yaml
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.40.0
          nfpm pkg -p deb -f nfpm.gen.yaml -t "mtufinder_${VERSION}_${ARCH}.deb"
          ls -la "mtufinder_${VERSION}_${ARCH}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: mtufinder-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mtufinder-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.goos == 'linux'
        with:
          name: mtufinder-deb-${{ matrix.goarch }}
          path: mtufinder_*_${{ matrix.goarch }}.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
